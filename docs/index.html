<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="更清晰地探索药物临床试验公开信息。按药物、适应症、分期和招募状态检索研究，查看完整登记详情。">
  <meta name="theme-color" content="#349E75">
  <title>临床试验检索 · 让研究更清晰可见</title>
  <link rel="preload" href="assets/fonts/noto-serif-sc-display.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/images/research-glass.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="app.css?v=7">
</head>
<body>
  <a class="skip-link" href="#trials">跳转到试验检索</a>
  <header class="site-header">
    <div class="header-inner shell">
      <a class="brand" href="./" aria-label="临床试验检索首页">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" rx="12" fill="currentColor"/><path d="M12 26V15m8 11V11m8 15v-8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="#fff"/><circle cx="28" cy="15" r="1.5" fill="#fff"/></svg>
        <span>临床试验<span class="brand-light">检索</span></span>
      </a>
      <nav class="main-nav" aria-label="主导航">
        <a href="#trials" class="nav-current">探索试验</a>
        <a href="#about">数据说明</a>
      </nav>
      <span class="header-note">公开数据 · 自由探索</span>
    </div>
  </header>

  <main id="main" class="shell">
    <section id="listView" aria-label="临床试验探索">
      <section class="hero" aria-label="临床研究介绍">
        <div class="hero-copy">
          <h1>让临床研究，<br><span>更清晰可见。</span></h1>
          <p class="hero-description">每一项研究，都是探索的开始。<br>在公开的药物临床试验中，找到你关注的方向。</p>
          <div class="hero-source"><span class="source-rule"></span><p id="snapshot">正在读取公开数据…</p></div>
        </div>
        <div class="hero-carousel" role="region" aria-roledescription="轮播图" aria-label="科学与生命主题视觉">
          <div class="carousel-slides" id="carouselSlides">
            <figure class="carousel-slide is-active" role="group" aria-roledescription="幻灯片" aria-label="第 1 张，共 3 张" aria-hidden="false">
              <img src="assets/images/research-glass.webp" width="1280" height="853" alt="暖色日光下的培养皿与绿色实验室玻璃器皿，AI 概念视觉" fetchpriority="high">
            </figure>
            <figure class="carousel-slide" role="group" aria-roledescription="幻灯片" aria-label="第 2 张，共 3 张" aria-hidden="true" inert>
              <img src="assets/images/research-nature.webp" width="1280" height="853" alt="透过光学镜片观察绿色银杏叶的细腻纹理，AI 概念视觉" loading="lazy">
            </figure>
            <figure class="carousel-slide" role="group" aria-roledescription="幻灯片" aria-label="第 3 张，共 3 张" aria-hidden="true" inert>
              <img src="assets/images/research-hands.webp" width="1280" height="853" alt="研究人员用滴管操作透明培养皿的近景，AI 概念视觉" loading="lazy">
            </figure>
          </div>
          <div class="carousel-controls">
            <p class="carousel-caption" id="carouselCaption">从细微之处，开启探索。</p>
            <div class="carousel-navigation">
              <div class="carousel-dots" role="group" aria-label="选择轮播图片">
                <button type="button" data-slide="0" aria-label="查看第 1 张图片" aria-current="true"></button>
                <button type="button" data-slide="1" aria-label="查看第 2 张图片"></button>
                <button type="button" data-slide="2" aria-label="查看第 3 张图片"></button>
              </div>
              <button type="button" class="carousel-toggle" id="carouselToggle" aria-label="暂停轮播"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg></button>
            </div>
          </div>
        </div>
      </section>

      <section class="search-section" id="trials" aria-label="试验检索">
        <form id="searchForm" role="search">
          <div class="search-line">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <label for="q" class="sr-only">关键词</label>
            <input id="q" type="search" placeholder="搜索药物、适应症、试验题目或登记号" autocomplete="off" enterkeyhint="search">
            <button class="primary-button" type="submit">搜索试验<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
          </div>
          <div class="filter-line">
            <div class="filters" id="filters"></div>
            <button class="text-button" id="clearBtn" type="button" hidden>清除筛选</button>
          </div>
        </form>
      </section>

      <section class="results-panel" aria-labelledby="resultsHeading">
        <div class="results-toolbar">
          <div class="results-intro"><h2 id="resultsHeading" tabindex="-1">研究一览</h2><p id="count" role="status">正在为你整理研究信息…</p></div>
          <div class="result-actions">
            <label class="sort-label" for="sortSelect"><span class="sr-only">排序方式</span><select id="sortSelect"><option value="id-desc">最新登记</option><option value="id-asc">最早登记</option></select></label>
            <button class="export-button" id="downloadBtn" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg>导出结果</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="search-table">
            <caption class="sr-only">临床试验查询结果，点击研究项目查看详情</caption>
            <colgroup><col class="col-project"><col class="col-ind"><col class="col-phase"><col class="col-status"></colgroup>
            <thead><tr><th scope="col">研究项目</th><th scope="col">适应症</th><th scope="col">试验阶段</th><th scope="col">招募状态</th></tr></thead>
            <tbody id="results"><tr><td colspan="4" class="table-message">正在读取研究索引…</td></tr></tbody>
          </table>
        </div>
        <div id="pagination" class="pagination-bar"></div>
      </section>
    </section>

    <article id="detailView" class="detail-view" aria-label="试验登记详情" hidden>
      <div class="detail-toolbar">
        <button class="back-button" id="backBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m6-6-6 6 6 6"/></svg>返回研究一览</button>
        <span class="detail-location" id="breadcrumbCurrent">试验详情</span>
        <button class="export-button" id="copyBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7V3h12v14h-4M3 7h14v14H3z"/></svg><span>复制链接</span></button>
      </div>
      <div id="detail" aria-live="polite"></div>
    </article>
  </main>

  <footer class="site-footer shell" id="about">
    <div><a class="footer-name" href="./">临床试验检索</a><p>让公开信息，更容易被看见。</p></div>
    <div class="footer-source"><p>数据来源：<a href="https://www.chinadrugtrials.org.cn/clinicaltrials.searchlist.dhtml" target="_blank" rel="noopener noreferrer">药物临床试验登记与信息公示平台<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H4v12h12v-4M10 3h7v7M17 3l-8 8"/></svg></a></p><p>本页为公开数据快照，最新状态请以原站公示为准。轮播图为 AI 概念视觉。</p></div>
  </footer>
  <script src="app.js?v=6"></script>
</body>
</html>
